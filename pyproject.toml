[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constella"
version = "0.2.0"
description = "Small library for organising a set of items: embedding groups to select, Jev to check each label per item"
authors = [{name = "Constella Contributors"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["clustering", "embeddings", "labeling", "jev"]
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
viz = ["umap-learn>=0.5.5", "matplotlib>=3.7"]  # only for `constella render`

[project.scripts]
constella = "constella.runner:main"

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["constella*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
